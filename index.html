<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mein Dashboard</title>
  <meta name="theme-color" content="#121212">
  
  <!-- Verknüpfung zur separaten Manifest-Datei -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbwWzHtVYuDbQw7RZSuHcQzX66GzK0iSgFeitkLIej_Vl7Iva0wYJvMXlocRW6JxT4Ch7A/exec" allow="clipboard-read; clipboard-write; geolocation"></iframe>

  <!-- Service Worker Registrierung (Pflicht für Android Chrome Installation) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
